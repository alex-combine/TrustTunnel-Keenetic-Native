name: Bug report / Сообщить об ошибке
description: Something does not work / Что-то не работает
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not post your server address, credentials, `config.toml` or the Telegram bot token.
        Не публикуйте адрес сервера, логины, пароли, `config.toml` и токен Telegram-бота.
  - type: dropdown
    id: part
    attributes:
      label: What is it about / Что не работает
      options:
        - Installer / Установщик (install.sh)
        - TrustTunnel VPN / VPN
        - Razvilka / Развилка
        - Not sure / Не знаю
    validations:
      required: true
  - type: input
    id: router
    attributes:
      label: Router model / Модель роутера
      placeholder: Keenetic Hero 4G (KN-2310)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: KeeneticOS version / Версия KeeneticOS
      placeholder: "5.1.6"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: TrustTunnel client version / Версия клиента
      description: "/opt/trusttunnel_client/trusttunnel_client --version"
  - type: dropdown
    id: mode
    attributes:
      label: Mode / Режим
      options:
        - TUN — attach
        - TUN — classic
        - SOCKS5
        - Not sure / Не знаю
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / Что случилось
      description: Steps, what you expected and what you got / Шаги, что ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: "Output of the installer check / Вывод проверки установщика"
      description: "curl -fsSL https://github.com/alex-combine/TrustTunnel-Keenetic-Native/releases/latest/download/install.sh | sh -s -- --check  (changes nothing / ничего не меняет)"
      render: text
  - type: textarea
    id: status
    attributes:
      label: "Output of `tt-stats status` and `/opt/etc/init.d/S99trusttunnel status` / Вывод этих команд"
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log / Журнал
      description: "tail -n 50 /opt/var/log/trusttunnel.log; installer / установщик: /opt/var/log/tt-install.log; Razvilka / Развилка: tail -n 50 /opt/var/log/razvilka.log — remove addresses / уберите адреса"
      render: text
