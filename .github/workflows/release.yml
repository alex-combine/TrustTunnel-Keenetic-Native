name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes - only this version's section of CHANGELOG.md
        run: |
          awk -v t="## ${GITHUB_REF_NAME} " 'index($0, t) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
      - name: Razvilka package (installer + files + READMEs)
        run: tar czf razvilka.tar.gz -C razvilka razvilka-install.sh razvilka-files README.md README_ru.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            install.sh
            configure.sh
            S99trusttunnel
            010-trusttunnel.sh
            tt-stats
            razvilka.tar.gz
          generate_release_notes: true
