name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            install.sh
            configure.sh
            S99trusttunnel
            010-trusttunnel.sh
            tt-stats
          generate_release_notes: true
